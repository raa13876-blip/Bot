<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GameMarket — Добавить аккаунт</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body data-page="add">
  <header class="topbar container">
    <a class="logo" href="index.html">🎮 GameMarket</a>
    <nav class="nav-actions" id="navActions"></nav>
  </header>

  <main class="container narrow">
    <section class="card">
      <h2 id="formTitle">Добавление аккаунта на продажу</h2>
      <form id="listingForm" class="form-grid">
        <label>Игра
          <select name="game" id="gameSelect" required></select>
        </label>
        <label>Уровень аккаунта
          <input type="text" name="level" required />
        </label>
        <label>Персонажи / скины
          <input type="text" name="characters" required />
        </label>
        <label>Смена почты
          <select name="canChangeEmail" required>
            <option value="true">Да</option>
            <option value="false">Нет</option>
          </select>
        </label>
        <label>Описание
          <textarea name="description" rows="5" required></textarea>
        </label>
        <label>Цена (₽)
          <input type="number" name="price" min="1" required />
        </label>
        <button class="btn btn-primary" type="submit">Опубликовать</button>
      </form>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
